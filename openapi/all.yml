# 由 tools/export_openapi_by_auth.py 生成，勿手改。
# servers 固定为 http://127.0.0.1:18090；换端口时改用服务在线提供的 /openapi/all.yml
openapi: "3.0.3"
info:
  title: 测试 API 提供服务 · 鉴权：全部场景
  version: "1.0.0"
  description: |-
    按鉴权类型合并的测试接口文档：全部鉴权类型的场景合在一份文档里（45 个场景 / 87 个端点）。

    - 每个场景一个 tag；tag 的 x-auth 是该场景的测试凭证与令牌流程。
    - 鉴权挂在每个 operation 的 security 上，scheme 名为 <场景>.<原名>。
    - x-test.role：DATA 业务接口 / TOKEN 登录与令牌接口（不要当数据接口调）/ FAULT 故障注入。
    - 每次测试前 POST http://127.0.0.1:18090/__admin/reset?scenario=<场景> 复位，调用后查 http://127.0.0.1:18090/__admin/requests。
servers:
  - url: http://127.0.0.1:18090
tags:
  - name: none
    description: 无鉴权（A 鉴权）：鉴权方式 NONE
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/none/openapi.json
  - name: bearer-static
    description: Bearer 静态令牌（A 鉴权）：BEARER_TOKEN + tokenSource=STATIC
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: Bearer test-token-abc
          prefix: Bearer
          note: 静态令牌，直接填写
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/bearer-static/openapi.json
  - name: bearer-request
    description: Bearer 调接口取令牌（Authorization 头）（A 鉴权）：BEARER_TOKEN + tokenSource=REQUEST，令牌注入 Header Authorization
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
          note: 注入到 HEADER Authorization，带前缀 Bearer
      extraAuthParams: []
      tokenFlow:
        kind: REQUEST_TOKEN
        method: POST
        contentType: application/json
        requestBody:
          username: test
          password: test-pass
        tokenPath: data.accessToken
        expiresInPath: data.expiresIn
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        url: http://127.0.0.1:18090/s/bearer-request/login
    x-openapi-url: http://127.0.0.1:18090/s/bearer-request/openapi.json
  - name: bearer-request-header
    description: Bearer 调接口取令牌（自定义头，无前缀）（A 鉴权）：tokenSource=REQUEST，令牌注入自定义 Header、不带 Bearer 前缀
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: X-Access-Token
          testValue: "<由令牌接口签发>"
          prefix: null
          note: 注入到 HEADER X-Access-Token，不带前缀
      extraAuthParams: []
      tokenFlow:
        kind: REQUEST_TOKEN
        method: POST
        contentType: application/json
        requestBody:
          username: test
          password: test-pass
        tokenPath: data.accessToken
        expiresInPath: data.expiresIn
        inject:
          in: HEADER
          name: X-Access-Token
          prefix: null
        url: http://127.0.0.1:18090/s/bearer-request-header/login
    x-openapi-url: http://127.0.0.1:18090/s/bearer-request-header/openapi.json
  - name: bearer-request-query
    description: Bearer 调接口取令牌（Query）（A 鉴权）：tokenSource=REQUEST，令牌注入 Query
    x-auth:
      type: bearer
      credentials:
        - in: QUERY
          name: access_token
          testValue: "<由令牌接口签发>"
          prefix: null
          note: 注入到 QUERY access_token，不带前缀
      extraAuthParams: []
      tokenFlow:
        kind: REQUEST_TOKEN
        method: POST
        contentType: application/json
        requestBody:
          username: test
          password: test-pass
        tokenPath: data.accessToken
        expiresInPath: data.expiresIn
        inject:
          in: QUERY
          name: access_token
          prefix: null
        url: http://127.0.0.1:18090/s/bearer-request-query/login
    x-openapi-url: http://127.0.0.1:18090/s/bearer-request-query/openapi.json
  - name: apikey-header
    description: API Key（请求头）（A 鉴权）：API_KEY in=header
    x-auth:
      type: apiKey
      credentials:
        - in: HEADER
          name: X-Api-Key
          testValue: test-key-123
          prefix: null
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/apikey-header/openapi.json
  - name: apikey-query
    description: API Key（Query）（A 鉴权）：API_KEY in=query
    x-auth:
      type: apiKey
      credentials:
        - in: QUERY
          name: api_key
          testValue: test-key-123
          prefix: null
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/apikey-query/openapi.json
  - name: apikey-cookie
    description: API Key（Cookie）（A 鉴权）：API_KEY in=cookie
    x-auth:
      type: apiKey
      credentials:
        - in: COOKIE
          name: api_key
          testValue: test-key-123
          prefix: null
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/apikey-cookie/openapi.json
  - name: apikey-header-prefix
    description: API Key（Authorization 头 + 前缀）（A 鉴权）：API_KEY 放 Authorization 头且带自定义前缀 Token
    x-auth:
      type: apiKey
      credentials:
        - in: HEADER
          name: Authorization
          testValue: Token test-key-123
          prefix: Token
          note: "完整值 `Token test-key-123`，无前缀或前缀不符一律 401"
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/apikey-header-prefix/openapi.json
  - name: apikey-extra
    description: API Key + 附加鉴权参数（A 鉴权）：API_KEY 主凭证与附加鉴权参数并存
    x-auth:
      type: apiKey
      credentials:
        - in: HEADER
          name: X-API-Key
          testValue: test-key-123
          prefix: null
      extraAuthParams:
        - name: X-App-Key
          in: HEADER
          value: extra-key-1
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/apikey-extra/openapi.json
  - name: basic
    description: Basic 认证（A 鉴权）：BASIC_AUTH
    x-auth:
      type: basic
      credentials:
        - in: HEADER
          name: Authorization
          testValue: Basic dGVzdDp0ZXN0LXBhc3M=
          prefix: Basic
          note: 用户名 test，密码 test-pass
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/basic/openapi.json
  - name: basic-extra
    description: Basic 认证 + 附加 Query（A 鉴权）：BASIC_AUTH 与附加鉴权参数并存
    x-auth:
      type: basic
      credentials:
        - in: HEADER
          name: Authorization
          testValue: Basic dGVzdDp0ZXN0LXBhc3M=
          prefix: Basic
          note: 用户名 test，密码 test-pass
      extraAuthParams:
        - name: tenant
          in: QUERY
          value: t-001
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/basic-extra/openapi.json
  - name: oauth2-post
    description: OAuth2（client_secret_post）（A 鉴权）：OAUTH2 客户端凭证，凭证放表单体
    x-auth:
      type: oauth2
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
      extraAuthParams: []
      tokenFlow:
        kind: OAUTH2_CLIENT_CREDENTIALS
        method: POST
        grantType: client_credentials
        clientAuthMethod: post
        clientId: test-client
        clientSecret: test-secret
        scope: read
        tokenPath: access_token
        expiresInPath: expires_in
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        url: http://127.0.0.1:18090/s/oauth2-post/oauth/token
    x-openapi-url: http://127.0.0.1:18090/s/oauth2-post/openapi.json
  - name: oauth2-basic
    description: OAuth2（client_secret_basic，令牌短寿）（A 鉴权）：OAUTH2 client_secret_basic + 令牌缓存失效后 401 重取并重放
    x-auth:
      type: oauth2
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
      extraAuthParams: []
      tokenFlow:
        kind: OAUTH2_CLIENT_CREDENTIALS
        method: POST
        grantType: client_credentials
        clientAuthMethod: basic
        clientId: test-client
        clientSecret: test-secret
        scope: read
        tokenPath: access_token
        expiresInPath: expires_in
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        tokenMaxUses: 2
        note: 令牌按使用次数失效：默认第 3 次业务请求返回 401，用于验证「401 后重取令牌并重放」
        url: http://127.0.0.1:18090/s/oauth2-basic/oauth/token
    x-openapi-url: http://127.0.0.1:18090/s/oauth2-basic/openapi.json
  - name: oauth2-extra
    description: OAuth2 + 附加鉴权参数（A 鉴权）：OAUTH2 与附加鉴权参数并存；令牌请求不带附加参数
    x-auth:
      type: oauth2
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
      extraAuthParams:
        - name: X-App-Key
          in: HEADER
          value: extra-key-1
      tokenFlow:
        kind: OAUTH2_CLIENT_CREDENTIALS
        method: POST
        grantType: client_credentials
        clientAuthMethod: post
        clientId: test-client
        clientSecret: test-secret
        scope: read
        tokenPath: access_token
        expiresInPath: expires_in
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        url: http://127.0.0.1:18090/s/oauth2-extra/oauth/token
    x-openapi-url: http://127.0.0.1:18090/s/oauth2-extra/openapi.json
  - name: oauth2-expiring
    description: OAuth2（令牌按时间过期）（A 鉴权）：OAUTH2 令牌缓存与过期刷新：距过期不足 30 秒应提前重取
    x-auth:
      type: oauth2
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
      extraAuthParams: []
      tokenFlow:
        kind: OAUTH2_CLIENT_CREDENTIALS
        method: POST
        grantType: client_credentials
        clientAuthMethod: post
        clientId: test-client
        clientSecret: test-secret
        scope: read
        tokenPath: access_token
        expiresInPath: expires_in
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        expiresInSeconds: 40
        note: 令牌按时间过期：签发 expiresInSeconds 秒后业务请求返回 401，用于验证「距过期不足 30 秒提前重取」
        url: http://127.0.0.1:18090/s/oauth2-expiring/oauth/token
    x-openapi-url: http://127.0.0.1:18090/s/oauth2-expiring/openapi.json
  - name: oauth2-paged-maxuses
    description: OAuth2 分页（令牌按次数失效）（A 鉴权）：一个批次内多次业务请求：复用令牌遇 401 → 重取 → 重放同页
    x-auth:
      type: oauth2
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
      extraAuthParams: []
      tokenFlow:
        kind: OAUTH2_CLIENT_CREDENTIALS
        method: POST
        grantType: client_credentials
        clientAuthMethod: post
        clientId: test-client
        clientSecret: test-secret
        scope: read
        tokenPath: access_token
        expiresInPath: expires_in
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        tokenMaxUses: 2
        note: 每个令牌最多用于 2 次业务请求，第 3 次起 401（oauth2PagedTokenMaxUses 可调）
        url: http://127.0.0.1:18090/s/oauth2-paged-maxuses/oauth/token
    x-openapi-url: http://127.0.0.1:18090/s/oauth2-paged-maxuses/openapi.json
  - name: oauth2-paged-expiring
    description: OAuth2 分页（令牌按时间过期 + 每页延迟）（A 鉴权）：一个批次内令牌临近过期：后端应主动重取，不应出现 401
    x-auth:
      type: oauth2
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
      extraAuthParams: []
      tokenFlow:
        kind: OAUTH2_CLIENT_CREDENTIALS
        method: POST
        grantType: client_credentials
        clientAuthMethod: post
        clientId: test-client
        clientSecret: test-secret
        scope: read
        tokenPath: access_token
        expiresInPath: expires_in
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        expiresInSeconds: 35
        note: "令牌有效 35 秒（oauth2PagedTtlSeconds 可调，**别调过 60**：后端对长效令牌换用「过期前 30 秒」规则）；每个业务请求服务端延迟 6 秒（oauth2PagedDelaySeconds 可调）。短效令牌按一半有效期复用，即 17.5 秒后才该重取"
        url: http://127.0.0.1:18090/s/oauth2-paged-expiring/oauth/token
    x-openapi-url: http://127.0.0.1:18090/s/oauth2-paged-expiring/openapi.json
  - name: fixed-param
    description: 固定参数鉴权（三个位置）（A 鉴权）：FIXED_PARAM：Header + Query + Cookie 同时必填
    x-auth:
      type: fixedParam
      credentials:
        - in: HEADER
          name: X-App-Id
          testValue: app-001
          prefix: null
        - in: QUERY
          name: sign
          testValue: test-sign
          prefix: null
        - in: COOKIE
          name: tenant
          testValue: t-001
          prefix: null
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/fixed-param/openapi.json
  - name: bearer-extra
    description: Bearer + 附加鉴权参数（A 鉴权）：BEARER_TOKEN 与附加鉴权参数（Header + Query）并存
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: Bearer test-token-abc
          prefix: Bearer
          note: 静态令牌，直接填写
      extraAuthParams:
        - name: X-App-Key
          in: HEADER
          value: extra-key-1
        - name: sign
          in: QUERY
          value: test-sign
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/bearer-extra/openapi.json
  - name: forbidden
    description: "403 权限不足（A 鉴权）：401 与 403 分类"
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: Bearer test-token-abc
          prefix: Bearer
          note: 静态令牌，直接填写
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/forbidden/openapi.json
  - name: token-json-body
    description: Bearer 取 Token（JSON 请求体，Token 在嵌套路径）（A 鉴权）：取 Token 接口只收 application/json；Token 路径 data.token.value 且带有效期字段
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
          note: 注入到 HEADER Authorization，带前缀 Bearer
      extraAuthParams: []
      tokenFlow:
        kind: REQUEST_TOKEN
        method: POST
        contentType: application/json
        requestBody:
          appKey: test-client
          appSecret: test-secret
        tokenPath: data.token.value
        expiresInPath: data.token.expiresIn
        expiresInSeconds: 7200
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        url: http://127.0.0.1:18090/s/token-json-body/auth/token
    x-openapi-url: http://127.0.0.1:18090/s/token-json-body/openapi.json
  - name: token-form-body
    description: Bearer 取 Token（表单请求体，Token 字段名非 access_token）（A 鉴权）：取 Token 接口只收 application/x-www-form-urlencoded；Token 在顶层 tokenValue
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
          note: 注入到 HEADER Authorization，带前缀 Bearer
      extraAuthParams: []
      tokenFlow:
        kind: REQUEST_TOKEN
        method: POST
        contentType: application/x-www-form-urlencoded
        requestBody:
          appKey: test-client
          appSecret: test-secret
        tokenPath: tokenValue
        expiresInPath: expiresIn
        expiresInSeconds: 7200
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        url: http://127.0.0.1:18090/s/token-form-body/auth/token
    x-openapi-url: http://127.0.0.1:18090/s/token-form-body/openapi.json
  - name: root-array
    description: 根数组不分页（B 分页）：记录路径 = 根数组；分页方式 NONE
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/root-array/openapi.json
  - name: page-number
    description: 页码分页（B 分页）：PAGE_NUMBER × QUERY；startFrom 1/0；不配每页数量靠空页结束
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/page-number/openapi.json
  - name: offset
    description: 偏移分页（B 分页）：OFFSET × QUERY；totalPath 结束；记录无主键
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/offset/openapi.json
  - name: cursor-query
    description: 游标分页（Query）（B 分页）：CURSOR × QUERY；next_cursor 为 null 结束
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/cursor-query/openapi.json
  - name: cursor-header
    description: 游标分页（请求头）（B 分页）：CURSOR × HEADER
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/cursor-header/openapi.json
  - name: cursor-body
    description: 游标分页（请求体）（B 分页）：CURSOR × BODY（E3-D1 修复后的能力）
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/cursor-body/openapi.json
  - name: next-url
    description: 下一页地址分页（B 分页）：NEXT_URL：同源绝对 / 相对 / 跨主机三种
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/next-url/openapi.json
  - name: body-page
    description: 请求体页码分页（B 分页）：PAGE_NUMBER × BODY + 请求体值类型保真
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/body-page/openapi.json
  - name: next-link-only
    description: 只支持 next 链接分页（B 分页）：只能跟随响应里 next 完整地址翻页、无任何分页参数 → 应标记为不支持
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/next-link-only/openapi.json
  - name: echo
    description: 请求回显（C 请求与响应）：Query / 请求体编码与类型保真验证
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/echo/openapi.json
  - name: single-object
    description: 记录路径命中单对象（C 请求与响应）：记录路径 × 单对象 → 1 条记录
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/single-object/openapi.json
  - name: biz-code
    description: 业务成功条件（C 请求与响应）：成功条件 EQ/NE × 数值/字符串 × 多允许值
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/biz-code/openapi.json
  - name: nested
    description: 嵌套对象与子表（C 请求与响应）：对象字段展开 + 嵌套数组子表（子表复制父字段）
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
