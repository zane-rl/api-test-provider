components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
      description: 错误响应体
  parameters:
    shared-params.TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: 租户 ID（公共参数）
      schema:
        type: string
    shared-params.Locale:
      name: locale
      in: query
      required: true
      description: 语言（公共参数）
      schema:
        type: string
        enum:
          - zh-CN
          - en-US
    shared-params.ApiVersion:
      name: apiVersion
      in: query
      required: true
      description: 接口版本号（公共参数）
      schema:
        type: integer
  securitySchemes:
    bearer-static.bearerAuth:
      type: http
      scheme: bearer
      description: 固定测试令牌 test-token-abc
    bearer-request.tokenAuth:
      type: http
      scheme: bearer
      description: 令牌由本场景的令牌接口签发
    bearer-request-header.tokenAuth:
      type: apiKey
      in: header
      name: X-Access-Token
      description: 令牌由本场景的令牌接口签发
    bearer-request-query.tokenAuth:
      type: apiKey
      in: query
      name: access_token
      description: 令牌由本场景的令牌接口签发
    apikey-header.apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 测试 API Key，固定值 test-key-123
    apikey-query.apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: 测试 API Key，固定值 test-key-123
    apikey-cookie.apiKeyCookie:
      type: apiKey
      in: cookie
      name: api_key
      description: 测试 API Key，固定值 test-key-123
    apikey-header-prefix.apiKeyHeader:
      type: apiKey
      in: header
      name: Authorization
      description: "测试 API Key，固定值 test-key-123；值须带前缀 `Token `（完整值：Token test-key-123）"
    apikey-extra.apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: 测试 API Key，固定值 test-key-123
    apikey-extra.extraHeaderXAppKey:
      type: apiKey
      in: header
      name: X-App-Key
      description: 测试 API Key，固定值 extra-key-1
    basic.basicAuth:
      type: http
      scheme: basic
      description: 测试账号 test / test-pass
    basic-extra.basicAuth:
      type: http
      scheme: basic
      description: 测试账号 test / test-pass
    basic-extra.extraQueryTenant:
      type: apiKey
      in: query
      name: tenant
      description: 测试 API Key，固定值 t-001
    oauth2-post.tokenAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://127.0.0.1:18090/s/oauth2-post/oauth/token
          scopes:
            read: 只读
