# 由 tools/export_openapi_by_auth.py 生成，勿手改。
# servers 固定为 http://127.0.0.1:18090；换端口时改用服务在线提供的 /openapi/bearer.yml
openapi: "3.0.3"
info:
  title: 测试 API 提供服务 · 鉴权：Bearer Token
  version: "1.0.0"
  description: |-
    按鉴权类型合并的测试接口文档：固定令牌，或先调登录接口取令牌再注入 Header / Query（10 个场景 / 18 个端点）。

    - 每个场景一个 tag；tag 的 x-auth 是该场景的测试凭证与令牌流程。
    - 鉴权挂在每个 operation 的 security 上，scheme 名为 <场景>.<原名>。
    - x-test.role：DATA 业务接口 / TOKEN 登录与令牌接口（不要当数据接口调）/ FAULT 故障注入。
    - 每次测试前 POST http://127.0.0.1:18090/__admin/reset?scenario=<场景> 复位，调用后查 http://127.0.0.1:18090/__admin/requests。
servers:
  - url: http://127.0.0.1:18090
tags:
  - name: bearer-static
    description: Bearer 静态令牌（A 鉴权）：BEARER_TOKEN + tokenSource=STATIC
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: Bearer test-token-abc
          prefix: Bearer
          note: 静态令牌，直接填写
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/bearer-static/openapi.json
  - name: bearer-request
    description: Bearer 调接口取令牌（Authorization 头）（A 鉴权）：BEARER_TOKEN + tokenSource=REQUEST，令牌注入 Header Authorization
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
          note: 注入到 HEADER Authorization，带前缀 Bearer
      extraAuthParams: []
      tokenFlow:
        kind: REQUEST_TOKEN
        method: POST
        contentType: application/json
        requestBody:
          username: test
          password: test-pass
        tokenPath: data.accessToken
        expiresInPath: data.expiresIn
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        url: http://127.0.0.1:18090/s/bearer-request/login
    x-openapi-url: http://127.0.0.1:18090/s/bearer-request/openapi.json
  - name: bearer-request-header
    description: Bearer 调接口取令牌（自定义头，无前缀）（A 鉴权）：tokenSource=REQUEST，令牌注入自定义 Header、不带 Bearer 前缀
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: X-Access-Token
          testValue: "<由令牌接口签发>"
          prefix: null
          note: 注入到 HEADER X-Access-Token，不带前缀
      extraAuthParams: []
      tokenFlow:
        kind: REQUEST_TOKEN
        method: POST
        contentType: application/json
        requestBody:
          username: test
          password: test-pass
        tokenPath: data.accessToken
        expiresInPath: data.expiresIn
        inject:
          in: HEADER
          name: X-Access-Token
          prefix: null
        url: http://127.0.0.1:18090/s/bearer-request-header/login
    x-openapi-url: http://127.0.0.1:18090/s/bearer-request-header/openapi.json
  - name: bearer-request-query
    description: Bearer 调接口取令牌（Query）（A 鉴权）：tokenSource=REQUEST，令牌注入 Query
    x-auth:
      type: bearer
      credentials:
        - in: QUERY
          name: access_token
          testValue: "<由令牌接口签发>"
          prefix: null
          note: 注入到 QUERY access_token，不带前缀
      extraAuthParams: []
      tokenFlow:
        kind: REQUEST_TOKEN
        method: POST
        contentType: application/json
        requestBody:
          username: test
          password: test-pass
        tokenPath: data.accessToken
        expiresInPath: data.expiresIn
        inject:
          in: QUERY
          name: access_token
          prefix: null
        url: http://127.0.0.1:18090/s/bearer-request-query/login
    x-openapi-url: http://127.0.0.1:18090/s/bearer-request-query/openapi.json
  - name: bearer-extra
    description: Bearer + 附加鉴权参数（A 鉴权）：BEARER_TOKEN 与附加鉴权参数（Header + Query）并存
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: Bearer test-token-abc
          prefix: Bearer
          note: 静态令牌，直接填写
      extraAuthParams:
        - name: X-App-Key
          in: HEADER
          value: extra-key-1
        - name: sign
          in: QUERY
          value: test-sign
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/bearer-extra/openapi.json
  - name: forbidden
    description: "403 权限不足（A 鉴权）：401 与 403 分类"
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: Bearer test-token-abc
          prefix: Bearer
          note: 静态令牌，直接填写
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/forbidden/openapi.json
  - name: token-json-body
    description: Bearer 取 Token（JSON 请求体，Token 在嵌套路径）（A 鉴权）：取 Token 接口只收 application/json；Token 路径 data.token.value 且带有效期字段
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
          note: 注入到 HEADER Authorization，带前缀 Bearer
      extraAuthParams: []
      tokenFlow:
        kind: REQUEST_TOKEN
        method: POST
        contentType: application/json
        requestBody:
          appKey: test-client
          appSecret: test-secret
        tokenPath: data.token.value
        expiresInPath: data.token.expiresIn
        expiresInSeconds: 7200
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        url: http://127.0.0.1:18090/s/token-json-body/auth/token
    x-openapi-url: http://127.0.0.1:18090/s/token-json-body/openapi.json
  - name: token-form-body
    description: Bearer 取 Token（表单请求体，Token 字段名非 access_token）（A 鉴权）：取 Token 接口只收 application/x-www-form-urlencoded；Token 在顶层 tokenValue
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
          note: 注入到 HEADER Authorization，带前缀 Bearer
      extraAuthParams: []
      tokenFlow:
        kind: REQUEST_TOKEN
        method: POST
        contentType: application/x-www-form-urlencoded
        requestBody:
          appKey: test-client
          appSecret: test-secret
        tokenPath: tokenValue
        expiresInPath: expiresIn
        expiresInSeconds: 7200
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        url: http://127.0.0.1:18090/s/token-form-body/auth/token
    x-openapi-url: http://127.0.0.1:18090/s/token-form-body/openapi.json
  - name: token-typed-fields
    description: Bearer 取 Token（返回里带布尔与小数字段）（A 鉴权）：取 Token 返回除令牌（文本）与有效期（整数）外还有布尔、小数字段；有效期路径的候选不应包含布尔字段
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
          note: 注入到 HEADER Authorization，带前缀 Bearer
      extraAuthParams: []
      tokenFlow:
        kind: REQUEST_TOKEN
        method: POST
        contentType: application/json
        requestBody:
          username: test
          password: test-pass
        tokenPath: data.accessToken
        expiresInPath: data.expiresIn
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        nonTextTokenResponseFields:
          boolean:
            - success
            - data.refreshable
          number:
            - data.refreshRatio
          integer:
            - code
            - data.expiresIn
        url: http://127.0.0.1:18090/s/token-typed-fields/login
    x-openapi-url: http://127.0.0.1:18090/s/token-typed-fields/openapi.json
  - name: token-slow
    description: Bearer 取 Token（取令牌接口延迟返回）（A 鉴权）：取 Token 接口校验通过后固定延迟若干秒再返回，验证取令牌期间的等待与超时提示
    x-auth:
      type: bearer
      credentials:
        - in: HEADER
          name: Authorization
          testValue: "<由令牌接口签发>"
          prefix: Bearer
          note: 注入到 HEADER Authorization，带前缀 Bearer
      extraAuthParams: []
      tokenFlow:
        kind: REQUEST_TOKEN
        method: POST
        contentType: application/json
        requestBody:
          username: test
          password: test-pass
        tokenPath: data.accessToken
        expiresInPath: data.expiresIn
        inject:
          in: HEADER
          name: Authorization
          prefix: Bearer
        tokenDelaySeconds: 5
        note: 取令牌接口延迟返回，秒数由 /__admin/config 的 tokenSlowDelaySeconds 调整（缺省 5）
        url: http://127.0.0.1:18090/s/token-slow/login
    x-openapi-url: http://127.0.0.1:18090/s/token-slow/openapi.json
