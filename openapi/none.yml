    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/biz-code/openapi.json
  - name: nested
    description: 嵌套对象与子表（C 请求与响应）：对象字段展开 + 嵌套数组子表（子表复制父字段）
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/nested/openapi.json
  - name: shared-params
    description: 公共参数（components.parameters）（C 请求与响应）：公共参数识别：components.parameters + $ref（操作级 / 路径项级）；内联的同名或重复参数不应被当成公共参数
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/shared-params/openapi.json
  - name: root-object-record
    description: 根对象作为一条记录（C 请求与响应）：记录路径 = 根对象 → 1 条记录；标量数组与对象数组保留为字段
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/root-object-record/openapi.json
  - name: form-body-post
    description: 表单请求体的业务 POST（C 请求与响应）：业务接口请求体为 application/x-www-form-urlencoded → 应标记为不支持
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/form-body-post/openapi.json
  - name: depend-path
    description: 路径参数依赖（D 依赖）：前置依赖映射 × PATH；逐父记录条数不同
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/depend-path/openapi.json
  - name: depend-body
    description: 请求体字段依赖（D 依赖）：前置依赖映射 × BODY
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/depend-body/openapi.json
  - name: faults
    description: 故障注入（E 故障）：错误处理策略、重试、限流、超时、非 JSON、截断、结构漂移、重定向
    x-auth:
      type: none
      credentials: []
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/faults/openapi.json
  - name: type-mismatch
    description: 字段类型不一致（刻意）（F 类型不一致）：验证接口时把真实响应与已保存字段类型做兼容性比对：文档声明与实际返回故意不一致（全项目唯一，含 2 个不该判不兼容的负例与 1 个对照组）
    x-auth:
