          content:
            application/json:
              schema:
                type: object
                properties:
                  orderNo:
                    type: string
                  status:
                    type: string
                  amount:
                    type: number
                  urgent:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
                  remark:
                    type: string
                    nullable: true
                  tags:
                    type: array
                    items:
                      type: string
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        lineNo:
                          type: integer
                        sku:
                          type: string
                        quantity:
                          type: integer
                        price:
                          type: number
              example:
                orderNo: ROOT-ORD-00001
                status: PAID
                amount: 237.5
                urgent: false
                createdAt: "2026-01-01T08:00:00+08:00"
                remark: null
                tags:
                  - a
                  - b
                lines:
                  - lineNo: 1
                    sku: PRD-00001
                    quantity: 2
                    price: 11.27
                  - lineNo: 2
                    sku: PRD-00002
                    quantity: 3
                    price: 12.64
        default:
          description: 错误响应（参数、鉴权或业务错误）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      x-original-operation-id: getRootOrder
      tags:
        - root-object-record
      x-scenario: root-object-record
      x-auth-type: none
      x-test:
        role: DATA
        paginationType: NONE
        pagination: {}
        recordPath: ""
        primaryKey: orderNo
        expectedTotal: 1
        requiresAuth: true
        note: 根对象即一条记录：tags / lines 应保留为该记录的数组字段，不应被展开成多条记录
        arrayFields:
          tags: SCALAR_ARRAY
          lines: OBJECT_ARRAY
