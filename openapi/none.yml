  /s/root-object-record/order:
    get:
      operationId: rootObjectRecord_getRootOrder
      summary: 查询单个订单（根对象）
      description: 响应的根就是一个对象，没有 code / data 包裹层；根对象里同时有标量字段、标量数组 tags 与对象数组 lines。应把根对象当作 1 条记录，数组保留为字段
