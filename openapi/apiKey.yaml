# 由 tools/export_openapi_by_auth.py 生成，勿手改。
# servers 固定为 http://127.0.0.1:18090；换端口时改用服务在线提供的 /openapi/apiKey.yaml
openapi: "3.0.3"
info:
  title: 测试 API 提供服务 · 鉴权：API Key
  version: "1.0.0"
  description: |-
    按鉴权类型合并的测试接口文档：Header / Query / Cookie 三种位置，含前缀与附加鉴权参数（5 个场景 / 5 个端点）。

    - 每个场景一个 tag；tag 的 x-auth 是该场景的测试凭证与令牌流程。
    - 鉴权挂在每个 operation 的 security 上，scheme 名为 <场景>.<原名>。
    - x-test.role：DATA 业务接口 / TOKEN 登录与令牌接口（不要当数据接口调）/ FAULT 故障注入。
    - 每次测试前 POST http://127.0.0.1:18090/__admin/reset?scenario=<场景> 复位，调用后查 http://127.0.0.1:18090/__admin/requests。
servers:
  - url: http://127.0.0.1:18090
tags:
  - name: apikey-header
    description: API Key（请求头）（A 鉴权）：API_KEY in=header；另提供 Swagger 2.0 文档
    x-auth:
      type: apiKey
      credentials:
        - in: HEADER
          name: X-Api-Key
          testValue: test-key-123
          prefix: null
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/apikey-header/openapi.json
  - name: apikey-query
    description: API Key（Query）（A 鉴权）：API_KEY in=query
    x-auth:
      type: apiKey
      credentials:
        - in: QUERY
          name: api_key
          testValue: test-key-123
          prefix: null
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/apikey-query/openapi.json
  - name: apikey-cookie
    description: API Key（Cookie）（A 鉴权）：API_KEY in=cookie
    x-auth:
      type: apiKey
      credentials:
        - in: COOKIE
          name: api_key
          testValue: test-key-123
          prefix: null
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/apikey-cookie/openapi.json
  - name: apikey-header-prefix
    description: API Key（Authorization 头 + 前缀）（A 鉴权）：API_KEY 放 Authorization 头且带自定义前缀 Token
    x-auth:
      type: apiKey
      credentials:
        - in: HEADER
          name: Authorization
          testValue: Token test-key-123
          prefix: Token
          note: "完整值 `Token test-key-123`，无前缀或前缀不符一律 401"
      extraAuthParams: []
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/apikey-header-prefix/openapi.json
  - name: apikey-extra
    description: API Key + 附加鉴权参数（A 鉴权）：API_KEY 主凭证与附加鉴权参数并存
    x-auth:
      type: apiKey
      credentials:
        - in: HEADER
          name: X-API-Key
          testValue: test-key-123
          prefix: null
      extraAuthParams:
        - name: X-App-Key
          in: HEADER
          value: extra-key-1
      tokenFlow: null
    x-openapi-url: http://127.0.0.1:18090/s/apikey-extra/openapi.json
paths:
  /s/apikey-header/items:
    get:
      operationId: apikeyHeader_listItems
      summary: 查询数据项列表
      description: 读取数据项，不分页，一次返回全部 20 条
      responses:
