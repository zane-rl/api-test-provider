                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            category:
                              type: string
                            price:
                              type: number
                            quantity:
                              type: integer
                            active:
                              type: boolean
                            updated_at:
                              type: string
                              format: date-time
                            remark:
                              type: string
                              nullable: true
                            spec:
                              type: object
                              properties:
                                length:
                                  type: number
                                width:
                                  type: number
                                unit:
                                  type: string
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: APIKEY-HEADER-00001
                      name: APIKEY-HEADER物料1
                      category: 整机
                      price: 11.27
